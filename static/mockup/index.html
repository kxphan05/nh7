<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopi</title>
<link rel="stylesheet" href="app.css?v=3">
<script src="i18n.js?v=2"></script><script src="audio/manifest.js?v=2"></script>
</head>
<body>
<header class="top">
  <div class="brand">☕ Kopi<span>Kaki</span></div>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="zh">中文</option><option value="ms">Bahasa Melayu</option><option value="ta">தமிழ்</option></select>
  <button id="bigger" aria-label="Bigger text">A+</button>
  <div class="menu" id="menu"><button id="dots" aria-label="Presenter menu">⋯</button>
    <div class="pop"><small>Presenter demo</small>
      <button onclick="D.quiet()">⏸ Simulate silence</button>
      <button onclick="D.scam()">🚨 Show scam pop-up</button>
      <button onclick="location.href='?l='+L">⟲ Restart</button></div></div>
</header>

<div class="main" id="main">
  <section class="chat">
    <div class="steps" id="steps"></div>
    <div class="scroll" id="scroll"><div class="col" id="col">
      <div class="hero" id="hero"><div class="logo">☕</div><h1 id="greet"></h1><p id="sub"></p>
        <button class="big" id="go"></button>
        <div class="starters"><button id="s1"></button><button id="s2"></button><button id="s3"></button></div></div>
    </div></div>
    <div class="composer">
      <div class="box" id="box"><input id="txt" aria-label="Message"><button class="mic" id="mic" aria-label="Speak">🎤</button><button class="send" id="send" aria-label="Send">➤</button></div>
      <div class="foot"><button id="person"></button><span id="priv"></span></div>
      <div class="disc" id="disc"></div>
    </div>
  </section>

  <aside class="doc" id="doc">
    <div class="hd">Sample Agency · Caregiver Support Portal (mock)</div>
    <div class="blk" id="b-title"><h2>Caregiver Support Grant: Application</h2><p>This grant helps care recipients and their caregivers with costs. Applications are means-tested.</p></div>
    <div class="blk" id="b-rel"><label>Who do you care for?</label><span class="val" id="v-rel"></span></div>
    <div class="blk" id="b-hrs"><label>Hours of care per week</label><span class="val" id="v-hrs"></span></div>
    <div class="blk" id="b-priv"><label>Your private details</label>
      <label class="f">NRIC number<input type="text" autocomplete="off"></label>
      <label class="f">Monthly household income<input type="text" autocomplete="off"></label>
      <label class="f">Bank account number<input type="text" autocomplete="off"></label>
      <small class="note" id="privnote"></small></div>
    <div class="blk" id="b-sub"><button class="sub" id="submit" disabled>Submit</button></div>
  </aside>
</div>

<script src="eliza.js?v=1"></script>
<script src="app.js?v=4"></script>
</body></html>
