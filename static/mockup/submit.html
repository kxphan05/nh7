<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopi · Submit</title><link rel="stylesheet" href="kopi.css?v=2"><script src="i18n.js?v=2"></script><script src="audio/manifest.js?v=2"></script><script src="kopi.js?v=2"></script></head>
<body>
<div class="form" id="form"></div>
<div class="kopi"><div class="in"><a class="person" id="person"></a><div class="say" id="say"></div><div class="btns" id="btns"></div></div></div>
<script>
renderForm(true);boot(6);spot('b-sub');
// Kopi never presses Submit; only the user's own tap finishes the form
show('sub',[],{cue:t('cue_press')});
$('#sub').onclick=()=>{
  show('fin',[[t('finish'),()=>go('index.html')]]);
  $('#sub').disabled=true;$('#sub').textContent=t('sent')};
</script></body></html>
